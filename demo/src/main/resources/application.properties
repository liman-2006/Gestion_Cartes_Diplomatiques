spring.application.name=demo

spring.datasource.url=jdbc:mysql://localhost:3306/gestion_cartes_consulaires
spring.datasource.username=root
spring.datasource.password=

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Envoi d'email (alertes automatiques de cartes a renouveler/expirees)
# MAIL_USERNAME / MAIL_PASSWORD doivent etre definies comme variables d'environnement
# (jamais en dur ici). Pour Gmail, MAIL_PASSWORD est un "mot de passe d'application" de 16
# caracteres genere sur https://myaccount.google.com/apppasswords (le mot de passe normal du
# compte ne fonctionne pas).
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}