<div class="entete-page">
  <div>
    <h1>Notifications</h1>
    <p class="sous-titre-page">Cartes à renouveler ou expirées, et renouvellements prêts à finaliser.</p>
  </div>
</div>

<div class="message-erreur" *ngIf="messageErreur">{{ messageErreur }}</div>

<div class="carte" *ngIf="!chargement">
  <div *ngFor="let notification of notifications" class="liste-item">
    <div class="liste-item-gauche">
      <span class="point-puce"></span>
      <div class="liste-item-principal">
        <span class="liste-item-titre">{{ notification.titre }}</span>
        <span class="liste-item-sous">{{ notification.sousTitre }}</span>
      </div>
    </div>
    <span class="badge" [ngClass]="notification.classeBadge">{{ notification.libelleBadge }}</span>
  </div>

  <p *ngIf="notifications.length === 0" class="etat-vide">Aucune notification pour le moment.</p>
</div>

<p *ngIf="chargement" class="etat-vide">Chargement...</p>
